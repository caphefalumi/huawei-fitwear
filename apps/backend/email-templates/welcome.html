<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to Fitwear</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #f4f7f5;
      color: #17211d;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 16px"
    >
      <tr>
        <td style="padding: 40px 36px">
          <p
            style="
              margin: 0 0 24px;
              color: #18794e;
              font-size: 14px;
              font-weight: 700;
              letter-spacing: 2px;
            "
          >
            FITWEAR
          </p>
          <h1 style="margin: 0 0 16px; font-size: 28px; line-height: 1.25">Welcome, {{{NAME}}}!</h1>
          <p style="margin: 0; color: #4b5b53; font-size: 16px; line-height: 1.6">
            Your Fitwear account is ready. Track your training, meals, and recovery in one place,
            and build a routine that works for you.
          </p>
          <p style="margin: 28px 0 0; color: #4b5b53; font-size: 14px; line-height: 1.6">
            Here’s to feeling stronger, one day at a time.
          </p>
        </td>
      </tr>
    </table>
