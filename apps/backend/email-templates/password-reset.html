<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your VoocHealth password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #ffffff;
      color: #17211d;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 16px"
    >
      <tr>
        <td style="padding: 40px 36px">
          <p
            style="
              margin: 0 0 24px;
              color: #ff6363;
              font-size: 14px;
              font-weight: 700;
              letter-spacing: 2px;
            "
          >
            VoocHealth
          </p>
          <h1 style="margin: 0 0 16px; font-size: 28px; line-height: 1.25">Reset your password</h1>
          <p style="margin: 0; color: #4b5b53; font-size: 16px; line-height: 1.6">
            Enter this 4-digit code in the VoocHealth app and choose a new password:
          </p>
          <p
            style="
              margin: 24px 0;
              color: #ff6363;
              font-size: 32px;
              font-weight: 700;
              letter-spacing: 8px;
            "
          >
            {{{RESET_OTP}}}
          </p>
          <p style="margin: 24px 0 0; color: #68776f; font-size: 14px; line-height: 1.6">
            This code expires in 10 minutes. If you didn’t request a password reset, you can ignore
            this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
