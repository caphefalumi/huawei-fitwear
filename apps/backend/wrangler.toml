name = "fitwear-backend"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true
preview_urls = true

[[d1_databases]]
binding = "DB"
database_name = "fitwear-d1"
database_id = "e7f57e76-0a1b-4a58-a4ff-acaaeb10586f"

[[kv_namespaces]]
binding = "fitwear_kv"
id = "2127ca61a1d64d8e94029989785ad853"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "MEAL_IMAGES"
bucket_name = "fitwear-meal-images"

[vars]
RESET_PASSWORD_URL = "https://fitwear.tm-project.id.vn/auth/reset-password"
RESEND_FROM = "fitwear@tm-project.id.vn"