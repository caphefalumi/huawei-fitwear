appId: com.fitwear.mobile
tags:
  - e2e
  - fitness
env:
  PASSWORD: "FitnessTest123!"
---
- evalScript: ${output.email = 'maestro_' + Date.now() + '_' + Math.floor(Math.random() * 1000000) + '@fitwear.dev'}
- launchApp:
    clearState: true
- startRecording:
    path: "fitness_e2e"
    label: "Capture fitness end-to-end test execution"
    optional: true

# 1. Register a new user
- assertVisible: "Welcome back."
- repeat:
    times: 5
    while:
      notVisible: "Create account"
    commands:
      - swipe:
          start: 5%, 80%
          end: 5%, 30%
- tapOn:
    text: "Create account"
    retryTapIfNoChange: true
- assertVisible: "Start your journey."
- tapOn:
    text: "Name"
    retryTapIfNoChange: true
- inputText: "Maestro E2E"
- tapOn: "Start your journey."
- tapOn:
    text: "Email"
    retryTapIfNoChange: true
- inputText: ${output.email}
- tapOn: "Start your journey."
- tapOn:
    text: "Password"
    retryTapIfNoChange: true
- inputText: ${PASSWORD}
- tapOn: "Start your journey."
- repeat:
    times: 10
    while:
      notVisible: ".*Terms of Service.*"
    commands:
      - swipe:
          start: 5%, 80%
          end: 5%, 30%
- tapOn:
    text: ".*Terms of Service.*"
    retryTapIfNoChange: true
- repeat:
    times: 5
    while:
      notVisible: "Create account"
    commands:
      - swipe:
          start: 5%, 80%
          end: 5%, 30%
- tapOn:
    text: "Create account"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# 2. Verify Session Persistence Across App Restart
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# 3. Sign Out
- tapOn: "Profile"
- repeat:
    times: 8
    while:
      notVisible: "Sign out"
    commands:
      - swipe:
          start: 5%, 80%
          end: 5%, 30%
- tapOn:
    text: "Sign out"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Welcome back."
    timeout: 30000

# 4. Login with Registered Credentials
- tapOn:
    text: "Email"
    retryTapIfNoChange: true
- inputText: ${output.email}
- tapOn: "Welcome back."
- tapOn:
    text: "Password"
    retryTapIfNoChange: true
- inputText: ${PASSWORD}
- tapOn: "Welcome back."
- repeat:
    times: 5
    while:
      notVisible: "Log in"
    commands:
      - swipe:
          start: 5%, 80%
          end: 5%, 30%
- tapOn:
    text: "Log in"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# 5. Verify App Content Access
- tapOn: "Meals"
- extendedWaitUntil:
    visible: "No meals logged yet. Add your first meal above."
    timeout: 20000

# 6. Delete Account to Clean Up
- tapOn: "Profile"
- repeat:
    times: 8
    while:
      notVisible: "Delete account"
    commands:
      - swipe:
          start: 5%, 80%
          end: 5%, 30%
- tapOn:
    text: "Delete account"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Welcome back."
    timeout: 30000
- stopRecording
