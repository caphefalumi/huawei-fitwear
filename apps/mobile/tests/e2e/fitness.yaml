appId: com.fitwear.mobile
env:
  PASSWORD: "FitnessTest123!"
---
- evalScript: ${output.email = 'maestro_' + Date.now() + '_' + Math.floor(Math.random() * 1000000) + '@fitwear.dev'}
- launchApp:
    clearState: true

# 1. Register a new user
- assertVisible: "Welcome back."
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
- tapOn: "Create account"
- tapOn: "Name"
- inputText: "Maestro E2E"
- tapOn: "Email"
- inputText: ${output.email}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn: "Date of birth"
- scrollUntilVisible:
    element: ".*Terms of Service.*"
    direction: DOWN
- tapOn: ".*Terms of Service.*"
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
- tapOn: "Create account"
- assertVisible: "Today"

# 2. Verify Session Persistence Across App Restart
- stopApp
- launchApp
- assertVisible: "Today"

# 3. Sign Out
- tapOn: "Profile"
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
- tapOn: "Sign out"
- assertVisible: "Welcome back."

# 4. Login with Registered Credentials
- tapOn: "Email"
- inputText: ${output.email}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn: "Welcome back."
- scrollUntilVisible:
    element: "Log in"
    direction: DOWN
- tapOn: "Log in"
- assertVisible: "Today"

# 5. Verify App Content Access
- tapOn: "Meals"
- assertVisible: "No meals logged yet. Add your first meal above."
