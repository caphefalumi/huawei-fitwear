appId: com.fitwear.mobile
tags:
  - e2e
  - fitness
---
- launchApp:
    clearState: true
- startRecording:
    path: "fitness_e2e"
    label: "Capture fitness end-to-end test execution"
    optional: true

# Sign in with the dedicated E2E account and verify the authenticated app.
- extendedWaitUntil:
    visible: "Explore the app"
    timeout: 30000
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Hi, welcome back."
    timeout: 20000
- tapOn: "example@gmail.com"
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn: "Your password"
- inputText: ${MAESTRO_TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# Session survives an app restart.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# Check the read-only fitness surfaces without changing health data.
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Profile overview"
    timeout: 20000
- tapOn:
    id: "tab-meals"
- extendedWaitUntil:
    visible: "No meals match.*"
    timeout: 20000
- tapOn:
    text: "Capture meal"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Capture your meal"
    timeout: 20000
- assertVisible: "Add a ruler"
- assertVisible: "Shoot from above"
- tapOn:
    text: "Close Capture your meal"
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible: "Add a ruler"
    timeout: 5000
- back
- tapOn:
    id: "tab-workout"
- assertVisible: "Workout"
- stopRecording
