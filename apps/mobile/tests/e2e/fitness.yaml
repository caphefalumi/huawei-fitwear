appId: com.fitwear.mobile
tags:
  - e2e
  - fitness
env:
  PASSWORD: "FitnessTest123!"
---
- evalScript: ${output.email = 'maestro_' + Date.now() + '_' + Math.floor(Math.random() * 1000000) + '@fitwear.dev'}
- launchApp:
    clearState: true

# 1. Register a new user
- assertVisible: "Welcome back."
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Create account"
    retryTapIfNoChange: true
- tapOn: "Name"
- inputText: "Maestro E2E"
- tapOn: "Email"
- inputText: ${output.email}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn: "Start your journey."
- scrollUntilVisible:
    element: ".*Terms of Service.*"
    direction: DOWN
    centerElement: true
- tapOn:
    text: ".*Terms of Service.*"
    retryTapIfNoChange: true
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Create account"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# 2. Verify Session Persistence Across App Restart
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# 3. Sign Out
- tapOn: "Profile"
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Sign out"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Welcome back."
    timeout: 30000

# 4. Login with Registered Credentials
- tapOn: "Email"
- inputText: ${output.email}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn: "Welcome back."
- scrollUntilVisible:
    element: "Log in"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Log in"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# 5. Verify App Content Access
- tapOn: "Meals"
- extendedWaitUntil:
    visible: "No meals logged yet. Add your first meal above."
    timeout: 20000

# 6. Delete Account to Clean Up
- tapOn: "Profile"
- scrollUntilVisible:
    element: "Delete account"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Delete account"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Welcome back."
    timeout: 30000
