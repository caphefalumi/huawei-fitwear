appId: com.fitwear.mobile
tags:
  - e2e
  - fitness
env:
  PASSWORD: "FitnessTest123!"
---
- evalScript: ${output.email = 'maestro_' + Date.now() + '_' + Math.floor(Math.random() * 1000000) + '@fitwear.dev'}
- launchApp:
    clearState: true

# 1. Register a new user
- assertVisible: "Welcome back."
- repeat:
    times: 5
    while:
      notVisible: "Create account"
    commands:
      - swipe:
          start: 5%, 80%
          end: 5%, 30%
- tapOn:
    text: "Create account"
    retryTapIfNoChange: true
- assertVisible: "Start your journey."
- tapOn:
    text: "Name"
    retryTapIfNoChange: true
- inputText: "Maestro E2E"
- tapOn: "Start your journey."
- tapOn:
    text: "Email"
    retryTapIfNoChange: true
- inputText: ${output.email}
- tapOn: "Start your journey."
- tapOn:
    text: "Password"
    retryTapIfNoChange: true
- inputText: ${PASSWORD}
- tapOn: "Start your journey."
- repeat:
    times: 10
    while:
      notVisible: ".*Terms of Service.*"
    commands:
      - swipe:
          start: 5%, 80%
          end: 5%, 30%
- tapOn:
    text: ".*Terms of Service.*"
    retryTapIfNoChange: true
- repeat:
    times: 5
    while:
      notVisible: "Create account"
    commands:
      - swipe:
          start: 5%, 80%
          end: 5%, 30%
- tapOn:
    text: "Create account"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# 2. Verify Session Persistence Across App Restart
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# 3. Sign Out
- tapOn: "Profile"
- repeat:
    times: 8
    while:
      notVisible: "Sign out"
    commands:
      - swipe:
          start: 5%, 80%
          end: 5%, 30%
- tapOn:
    text: "Sign out"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Welcome back."
    timeout: 30000

# 4. Login with Registered Credentials
- tapOn:
    text: "Email"
    retryTapIfNoChange: true
- inputText: ${output.email}
- tapOn: "Welcome back."
- tapOn:
    text: "Password"
    retryTapIfNoChange: true
- inputText: ${PASSWORD}
- tapOn: "Welcome back."
- repeat:
    times: 5
    while:
      notVisible: "Log in"
    commands:
      - swipe:
          start: 5%, 80%
          end: 5%, 30%
- tapOn:
    text: "Log in"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# 5. Verify App Content Access
- tapOn: "Meals"
- extendedWaitUntil:
    visible: "No meals logged yet. Add your first meal above."
    timeout: 20000

# 6. First Capture Tutorial
- tapOn:
    text: "Capture meal"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Capture your meal"
    timeout: 20000
- assertVisible: "Add a ruler"
- assertVisible: "Shoot from above"
- assertNotVisible: "Review & edit"
- assertNotVisible: ".*Three quick tips.*"
- tapOn:
    text: "Close Capture your meal"
    retryTapIfNoChange: true
- assertNotVisible: "Add a ruler"
- back

# 7. Period Recovery Plan (one tap, then reflected in Workout)
- tapOn: "Profile"
- repeat:
    times: 8
    while:
      notVisible: "Sex / gender.*"
    commands:
      - swipe:
          start: 5%, 30%
          end: 5%, 80%
- tapOn:
    text: "Sex / gender.*"
    retryTapIfNoChange: true
- tapOn:
    text: "Female"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Sex / gender, Female"
    timeout: 20000
- repeat:
    times: 8
    while:
      notVisible: "I am in my period"
    commands:
      - swipe:
          start: 5%, 80%
          end: 5%, 30%
- tapOn:
    text: "I am in my period"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "My period has ended"
    timeout: 20000
- tapOn: "Workout"
- extendedWaitUntil:
    visible: "Edit recovery plan.*"
    timeout: 20000
- assertVisible: "Rest"
- assertVisible: "Rehab"
- assertVisible: "Return"
- repeat:
    times: 8
    while:
      notVisible: "View Chest workout plan"
    commands:
      - swipe:
          start: 5%, 80%
          end: 5%, 30%
- assertNotVisible: "View Recovery workout plan"
- tapOn: "Profile"
- tapOn:
    text: "My period has ended"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "I am in my period"
    timeout: 20000
- tapOn: "Workout"
- assertNotVisible: "Edit recovery plan.*"

# 8. Delete Account to Clean Up
- tapOn: "Profile"
- repeat:
    times: 8
    while:
      notVisible: "Delete account"
    commands:
      - swipe:
          start: 5%, 80%
          end: 5%, 30%
- tapOn:
    text: "Delete account"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Welcome back."
    timeout: 30000
