appId: com.fitwear.mobile
tags:
  - e2e
  - errors
---
- setAirplaneMode: disabled
# Stop the previous flow before clearing data: Android can otherwise finish
# removing its task after launch and kill the newly started process.
- stopApp
- launchApp:
    clearState: true
- startRecording:
    path: "error_messages_e2e"
    label: "Capture error-message E2E execution"
    optional: true

- extendedWaitUntil:
    visible: "Explore the app"
    timeout: 30000
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Hi, welcome back."
    timeout: 20000

# Sign-up client validation before credential login (submit stays enabled; errors from submit()).
- tapOn: "Sign up"
- extendedWaitUntil:
    visible: "Create account"
    timeout: 10000
- tapOn:
    id: "sign-up-submit"
- assertVisible: "Enter your name and a valid email address."
- tapOn: "Your username"
- inputText: "E2E Member"
- tapOn: "Your email"
- inputText: "e2e.member@fitwear.dev"
- tapOn: "Day"
- inputText: "12"
- tapOn: "Month"
- inputText: "03"
- tapOn: "Year"
- inputText: "1998"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "sign-up-password"
    direction: DOWN
- tapOn:
    id: "sign-up-password"
- inputText: "short"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "sign-up-submit"
    direction: DOWN
- tapOn:
    id: "sign-up-submit"
- assertVisible: "Password must contain at least 8 characters."
- scrollUntilVisible:
    element:
      id: "sign-up-password"
    direction: UP
- tapOn:
    id: "sign-up-password"
- eraseText: 100
- inputText: "password123"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "sign-up-submit"
    direction: DOWN
- tapOn:
    id: "sign-up-submit"
- assertVisible: "Please agree to the terms before creating an account."
- scrollUntilVisible:
    element: "Log in"
    direction: DOWN
- tapOn: "Log in"
- extendedWaitUntil:
    visible: "Hi, welcome back."
    timeout: 10000

# Login validation and invalid credentials use the dedicated E2E account.
- tapOn: "example@gmail.com"
- inputText: "invalid-email"
- hideKeyboard
- tapOn:
    id: "login-submit"
- assertVisible: "Enter a valid email address."
- tapOn: "invalid-email"
- eraseText
- inputText: ${MAESTRO_TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-submit"
- assertVisible: "Enter your password."
- tapOn:
    id: "login-password"
- inputText: "wrong-maestro-password"
- hideKeyboard
- tapOn:
    id: "login-submit"
- assertVisible: "We could not sign you in. Check your email and password and try again."

# Clear the previous credential error before testing the offline failure. The
# inline error expands the form and can push the submit button below the viewport.
- setAirplaneMode: enabled
- tapOn:
    id: "login-password"
- eraseText: 100
- inputText: "offline-maestro-password"
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Can't connect. Check your connection and try again."
    timeout: 20000
- setAirplaneMode: disabled
- tapOn:
    id: "login-password"
- eraseText: 100
- inputText: ${MAESTRO_TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# Profile health load failure after offline cold start (health queries use networkMode: always).
- stopApp
- setAirplaneMode: enabled
- launchApp
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Could not load your health data."
    timeout: 30000
- tapOn: "Retry"
- extendedWaitUntil:
    visible: "Could not load your health data."
    timeout: 20000
- setAirplaneMode: disabled

# Meal manual entry validation on an empty reviewed item.
- tapOn:
    id: "tab-meals"
- extendedWaitUntil:
    visible: "Capture meal"
    timeout: 20000
- tapOn:
    text: "Capture meal"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Capture your meal"
    timeout: 20000
- tapOn:
    text: "Close Capture your meal"
    retryTapIfNoChange: true
- tapOn: "Enter meal manually"
- extendedWaitUntil:
    visible: "Log Meal"
    timeout: 20000
- tapOn: "+ Add item"
- extendedWaitUntil:
    visible: "Enter nutrition manually"
    timeout: 20000
- tapOn: "Enter nutrition manually"
- extendedWaitUntil:
    visible: "Add item"
    timeout: 20000
- tapOn: "Add item"
- assertVisible: "Enter a name, positive amount and all nutrition values (zero is allowed)."

- stopRecording
- stopApp
