appId: com.fitwear.mobile
tags:
  - e2e
  - errors
---
- setAirplaneMode: disabled
# Stop the previous flow before clearing data: Android can otherwise finish
# removing its task after launch and kill the newly started process.
- stopApp
- launchApp:
    clearState: true
- startRecording:
    path: "error_messages_e2e"
    label: "Capture error-message E2E execution"
    optional: true

- extendedWaitUntil:
    visible: "Explore the app"
    timeout: 30000
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Hi, welcome back."
    timeout: 20000

# Empty-email reset validation stops before the request, so the dedicated
# account is never emailed.
- tapOn: "Forgot password?"
- extendedWaitUntil:
    visible: "Reset your password."
    timeout: 10000
- hideKeyboard
- tapOn: "Send reset code"
- assertVisible: "Enter your email address."
- tapOn: "Back to log in"
- extendedWaitUntil:
    visible: "Hi, welcome back."
    timeout: 10000

# Sign-up client validation before credential login (submit stays enabled; errors from submit()).
- tapOn: "Sign up"
- extendedWaitUntil:
    visible: "Create account"
    timeout: 10000
- tapOn:
    id: "sign-up-submit"
- assertVisible: "Enter your username."
- assertVisible: "Enter your email address."
- tapOn: "Your username"
- inputText: "E2E Member"
- tapOn: "Your email"
- inputText: "e2e.member@fitwear.dev"
- scrollUntilVisible:
    element:
      id: "sign-up-dob-month"
    direction: UP
- tapOn:
    id: "sign-up-dob-year"
- inputText: "1998"
- tapOn:
    id: "sign-up-dob-month"
- inputText: "03"
- tapOn:
    id: "sign-up-dob-day"
- inputText: "12"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "sign-up-password"
    direction: DOWN
- tapOn:
    id: "sign-up-password"
- inputText: "short"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "sign-up-submit"
    direction: DOWN
- tapOn:
    id: "sign-up-submit"
- assertVisible: "Use at least 8 characters."
- scrollUntilVisible:
    element:
      id: "sign-up-password"
    direction: UP
- tapOn:
    id: "sign-up-password"
- eraseText: 100
- inputText: "password123"
- hideKeyboard

# Invalid and future birth dates are rejected before the terms check.
# Enter each selected field separately. Android inputText types characters and
# auto-advance moves focus before a whole ISO date can reach one input.
- scrollUntilVisible:
    element:
      id: "sign-up-dob-year"
    direction: UP
- tapOn:
    id: "sign-up-dob-year"
- inputText: "1998"
- tapOn:
    id: "sign-up-dob-month"
- inputText: "02"
- tapOn:
    id: "sign-up-dob-day"
- inputText: "31"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "sign-up-submit"
    direction: DOWN
- tapOn:
    id: "sign-up-submit"
- scrollUntilVisible:
    element: "Enter a valid date of birth."
    direction: UP
    timeout: 10000
- assertVisible: "Enter a valid date of birth."
# Start with blank fields so auto-advance and text selection cannot retain a prior date.
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Explore the app"
    timeout: 30000
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Hi, welcome back."
    timeout: 20000
- tapOn: "Sign up"
- extendedWaitUntil:
    visible: "Create account"
    timeout: 10000
- tapOn: "Your username"
- inputText: "E2E Member"
- tapOn: "Your email"
- inputText: "e2e.member@fitwear.dev"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "sign-up-dob-year"
    direction: DOWN
- tapOn:
    id: "sign-up-dob-year"
- inputText: "2099"
- tapOn:
    id: "sign-up-dob-month"
- inputText: "01"
- tapOn:
    id: "sign-up-dob-day"
- inputText: "01"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "sign-up-password"
    direction: DOWN
- tapOn:
    id: "sign-up-password"
- inputText: "password123"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "sign-up-submit"
    direction: DOWN
- tapOn:
    id: "sign-up-submit"
- scrollUntilVisible:
    element: "Date of birth can't be in the future."
    direction: UP
    timeout: 10000
- assertVisible: "Date of birth can't be in the future."
# Start with blank fields so auto-advance and text selection cannot retain a prior date.
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Explore the app"
    timeout: 30000
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Hi, welcome back."
    timeout: 20000
- tapOn: "Sign up"
- extendedWaitUntil:
    visible: "Create account"
    timeout: 10000
- tapOn: "Your username"
- inputText: "E2E Member"
- tapOn: "Your email"
- inputText: "e2e.member@fitwear.dev"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "sign-up-dob-year"
    direction: DOWN
- tapOn:
    id: "sign-up-dob-year"
- inputText: "1998"
- tapOn:
    id: "sign-up-dob-month"
- inputText: "03"
- tapOn:
    id: "sign-up-dob-day"
- inputText: "12"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "sign-up-password"
    direction: DOWN
- tapOn:
    id: "sign-up-password"
- inputText: "password123"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "sign-up-submit"
    direction: DOWN
- tapOn:
    id: "sign-up-submit"
- assertVisible: "Please agree to the terms before creating an account."
# Maestro's center swipe starts inside the DOB inputs here; start on the
# submit button so the ScrollView receives the gesture instead.
- swipe:
    from:
      id: "sign-up-submit"
    direction: UP
- scrollUntilVisible:
    element: "Log in"
    direction: DOWN
- tapOn: "Log in"
- extendedWaitUntil:
    visible: "Hi, welcome back."
    timeout: 10000

# Login validation and invalid credentials use the dedicated E2E account.
- tapOn: "example@gmail.com"
- inputText: "invalid-email"
- hideKeyboard
- tapOn:
    id: "login-submit"
- assertVisible: "Enter a valid email address."
- tapOn: "invalid-email"
- eraseText
- inputText: ${MAESTRO_TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-submit"
- assertVisible: "Enter your password."
- tapOn:
    id: "login-password"
- inputText: "wrong-maestro-password"
- hideKeyboard
- tapOn:
    id: "login-submit"
- assertVisible: "We could not sign you in. Check your email and password and try again."

# Clear the previous credential error before testing the offline failure. The
# inline error expands the form and can push the submit button below the viewport.
- setAirplaneMode: enabled
- tapOn:
    id: "login-password"
- eraseText: 100
- inputText: "offline-maestro-password"
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Can't connect. Check your connection and try again."
    timeout: 20000
- setAirplaneMode: disabled
- tapOn:
    id: "login-password"
- eraseText: 100
- inputText: ${MAESTRO_TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# Saved tokens still require server validation. Offline cold start must release
# the splash without exposing private data; reconnecting can restore the token.
- stopApp
- setAirplaneMode: enabled
- launchApp
- extendedWaitUntil:
    visible: "Explore the app|Hi, welcome back."
    timeout: 30000
- runFlow:
    when:
      visible: "Explore the app"
    commands:
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Could not reach the server. Check your connection and try again."
    timeout: 10000
- assertNotVisible:
    id: "tab-profile"
- stopApp
- setAirplaneMode: disabled
- launchApp
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# Meal manual entry validation on an empty reviewed item.
- tapOn:
    id: "tab-meals"
- extendedWaitUntil:
    visible: "Capture meal"
    timeout: 20000
- tapOn:
    text: "Capture meal"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Capture your meal"
    timeout: 20000
- tapOn:
    text: "Close Capture your meal"
    retryTapIfNoChange: true
- tapOn: "Enter meal manually"
- extendedWaitUntil:
    visible: "Log Meal"
    timeout: 20000
- tapOn: "+ Add item"
- extendedWaitUntil:
    visible: "Enter nutrition manually"
    timeout: 20000
- tapOn: "Enter nutrition manually"
- extendedWaitUntil:
    visible: "Add item"
    timeout: 20000
- tapOn: "Add item"
- assertVisible: "Enter a name, positive amount and all nutrition values (zero is allowed)."

# Offline meal save fails without losing the draft; retry persists it. The daily
# kcal value is unique so the history assertion proves the retried write.
- scrollUntilVisible:
    element: "Food or drink name"
    direction: UP
- tapOn: "Food or drink name"
- inputText: "E2E Offline Meal"
- tapOn: "Amount, g"
- inputText: "100"
- hideKeyboard
- scrollUntilVisible:
    element: "Energy, kcal"
    direction: DOWN
- tapOn: "Energy, kcal"
- inputText: "9876"
- hideKeyboard
- scrollUntilVisible:
    element: "Protein, g"
    direction: DOWN
- tapOn: "Protein, g"
- inputText: "1"
- hideKeyboard
- scrollUntilVisible:
    element: "Carbs, g"
    direction: DOWN
- tapOn: "Carbs, g"
- inputText: "1"
- hideKeyboard
- scrollUntilVisible:
    element: "Fat, g"
    direction: DOWN
- tapOn: "Fat, g"
- inputText: "1"
- hideKeyboard
- scrollUntilVisible:
    element: "Add item"
    direction: DOWN
- tapOn: "Add item"
- extendedWaitUntil:
    visible: "Log Meal"
    timeout: 20000
- setAirplaneMode: enabled
- tapOn: "Log Meal"
- scrollUntilVisible:
    element: "Could not save your meal"
    direction: UP
    timeout: 30000
- assertVisible: "Could not connect to save your change. Check your connection and try again. Your entries are still here."
- setAirplaneMode: disabled
- tapOn: "Try again"
- extendedWaitUntil:
    notVisible: "Could not save your meal"
    timeout: 30000
# The error clears as soon as the retry starts; the draft only empties once the
# save resolves, so wait for the cleared list before restarting the app.
- scrollUntilVisible:
    element: "No items yet.*"
    direction: DOWN
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- tapOn:
    id: "tab-meals"
- extendedWaitUntil:
    visible: "Meals"
    timeout: 20000
# The first history fetch after a cold start can trail the emulator's radio
# reconnect, so allow it longer than the default assertion timeout.
- extendedWaitUntil:
    visible: "9876 kcal"
    timeout: 60000

# Remove the logged meal so later flows still see the account's empty history.
- tapOn: "9876 kcal"
- extendedWaitUntil:
    visible: "Back to Meal"
    timeout: 10000
- tapOn:
    text: "Delete"
    index: 0
- extendedWaitUntil:
    notVisible: "9876 kcal"
    timeout: 30000

- stopRecording
- stopApp
