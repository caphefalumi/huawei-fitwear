plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.networkreset'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.networkreset"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // OkHttpClientProvider and OkHttp itself come from React Native.
  implementation 'com.facebook.react:react-android'
}
