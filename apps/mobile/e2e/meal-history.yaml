appId: com.fitwear.mobile
tags:
  - e2e
  - meals
---
# Critical meal journal flow: log a meal, confirm it, move it to yesterday,
# open that day from the calendar, find it by food name, then delete it with
# Undo. The CI cleanup step removes any meal this flow leaves behind.
- setAirplaneMode: disabled
- stopApp
- extendedWaitUntil:
    visible:
      id: "previous-task-removed"
    optional: true
    timeout: 3000
- launchApp:
    clearState: true
- startRecording:
    path: "meal_history_e2e"
    label: "Capture meal history end-to-end test execution"
    optional: true

- extendedWaitUntil:
    visible: "Explore the app"
    timeout: 30000
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Hi, welcome back."
    timeout: 20000
- tapOn: "example@gmail.com"
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# Log a meal with a manually entered item.
- tapOn:
    text: "Capture meal"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Capture your meal"
    timeout: 20000
- tapOn:
    text: "Close Capture your meal"
    retryTapIfNoChange: true
- tapOn: "Enter meal manually"
- extendedWaitUntil:
    visible: '\+ Add item'
    timeout: 15000
- tapOn: '\+ Add item'
- tapOn: "Enter nutrition manually"
- extendedWaitUntil:
    visible: "Manual item"
    timeout: 15000
- tapOn:
    id: "input-food-or-drink-name"
- inputText: "E2E Journal Soup"
- tapOn:
    id: "input-amount"
- inputText: "300"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "input-energy"
    direction: DOWN
- tapOn:
    id: "input-energy"
- inputText: "240"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "input-protein"
    direction: DOWN
- tapOn:
    id: "input-protein"
- inputText: "12"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "input-carbs"
    direction: DOWN
- tapOn:
    id: "input-carbs"
- inputText: "30"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "input-fat"
    direction: DOWN
- tapOn:
    id: "input-fat"
- inputText: "8"
- hideKeyboard
- scrollUntilVisible:
    element: "Add item"
    direction: DOWN
- tapOn: "Add item"
- extendedWaitUntil:
    visible: "E2E Journal Soup"
    timeout: 15000
- scrollUntilVisible:
    element: "Log Meal"
    direction: DOWN
- tapOn: "Log Meal"

# The save is confirmed, and View opens the saved meal.
- extendedWaitUntil:
    visible: "Saved E2E Journal Soup"
    timeout: 20000
- tapOn: "View"
- extendedWaitUntil:
    visible: "Meal time.*"
    timeout: 15000

# Move the meal to yesterday from the meal detail.
- tapOn: "Meal time.*"
- extendedWaitUntil:
    visible: "The meal moves to the day you pick."
    timeout: 10000
- tapOn:
    id: "meal-time-yesterday"
- tapOn: "Save meal time"
- extendedWaitUntil:
    notVisible: "The meal moves to the day you pick."
    timeout: 15000
- back

# Today no longer lists the meal; the calendar opens yesterday.
- tapOn:
    id: "tab-meals"
- extendedWaitUntil:
    visible: "Meals history ›"
    timeout: 20000
- assertNotVisible: "E2E Journal Soup.*"
- tapOn: "Meals history ›"
- extendedWaitUntil:
    visible: "Pick a day to see what you ate."
    timeout: 10000
- evalScript: ${output.day = new Date(Date.now() - 86400000)}
- evalScript: ${output.yesterday = output.day.getFullYear() + '-' + ('0' + (output.day.getMonth() + 1)).slice(-2) + '-' + ('0' + output.day.getDate()).slice(-2)}
- runFlow:
    when:
      true: ${output.day.getMonth() !== new Date().getMonth()}
    commands:
      - tapOn: "Previous month"
- tapOn:
    id: ${'calendar-day-' + output.yesterday}

# The day view shows the meal and its total under Yesterday.
- extendedWaitUntil:
    visible: "E2E Journal Soup.*"
    timeout: 10000
- assertVisible: "Yesterday"
- assertVisible: "240 / .* kcal|240 kcal"
- tapOn: "Show macro breakdown"
- assertVisible: "12.*g Protein"
- tapOn: "Hide macro breakdown"

# The swipe tip can be dismissed for good.
- tapOn: "Dismiss tip"
- assertNotVisible: "Swipe left on a meal to delete it."

# Search works across days by food name, ignoring case.
- tapOn: "Search food"
- inputText: "e2e journal"
- hideKeyboard
- assertVisible: "E2E Journal Soup.*"
- assertVisible: "1 meal"
- tapOn: "Clear food search"

# Swipe to delete, undo, then delete for good.
- swipe:
    from: "E2E Journal Soup.*"
    direction: LEFT
- tapOn: "Delete E2E Journal Soup"
- extendedWaitUntil:
    visible: "Meal deleted"
    timeout: 5000
- assertNotVisible: "E2E Journal Soup.*"
- tapOn: "Undo"
- extendedWaitUntil:
    visible: "E2E Journal Soup.*"
    timeout: 5000
- swipe:
    from: "E2E Journal Soup.*"
    direction: LEFT
- tapOn: "Delete E2E Journal Soup"
- extendedWaitUntil:
    notVisible: "Meal deleted"
    timeout: 10000
- extendedWaitUntil:
    notVisible: "E2E Journal Soup.*"
    timeout: 15000
- assertVisible: "No meals logged on.*|No meals yet"

# The deletion reached the server: search finds nothing after a restart.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- tapOn:
    id: "tab-meals"
- extendedWaitUntil:
    visible: "Meals history ›"
    timeout: 20000
- tapOn: "Search food"
- inputText: "e2e journal"
- hideKeyboard
- extendedWaitUntil:
    visible: "No meals match.*"
    timeout: 15000
- stopRecording
