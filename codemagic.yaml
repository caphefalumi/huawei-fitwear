workflows:
  android-workflow:
    name: Mobile Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      vars:
        PATH: "$HOME/.bun/bin:$PATH"
        PACKAGE_NAME: "com.fitwear.mobile"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install Bun
        script: |
          curl -fsSL https://bun.sh/install | bash
      - name: Install dependencies & verify
        script: |
          bun install
          cd apps/mobile && bunx tsc --noEmit
      - name: Expo prebuild
        script: |
          cd apps/mobile && bunx expo prebuild --platform android --clean
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/apps/mobile/android/local.properties"
      - name: Build Android app
        script: |
          cd apps/mobile/android
          ./gradlew assembleDebug
    artifacts:
      - apps/mobile/android/app/build/outputs/**/*.apk
      - apps/mobile/android/app/build/outputs/**/*.aab

  ios-workflow:
    name: Mobile iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: com.fitwear.mobile
      vars:
        PATH: "$HOME/.bun/bin:$PATH"
        XCODE_WORKSPACE: "mobile.xcworkspace"
        XCODE_SCHEME: "mobile"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install Bun
        script: |
          curl -fsSL https://bun.sh/install | bash
      - name: Install dependencies & verify
        script: |
          bun install
          cd apps/mobile && bunx tsc --noEmit
      - name: Expo prebuild
        script: |
          cd apps/mobile && bunx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd apps/mobile/ios && pod install
      - name: Build iOS app & package IPA
        script: |
          cd "$CM_BUILD_DIR/apps/mobile/ios"
          if which xcode-project > /dev/null 2>&1 && [ -n "$CM_CERTIFICATE" ]; then
            xcode-project use-profiles
            xcode-project build-ipa \
              --workspace "$XCODE_WORKSPACE" \
              --scheme "$XCODE_SCHEME"
          else
            xcodebuild \
              -workspace "$XCODE_WORKSPACE" \
              -scheme "$XCODE_SCHEME" \
              -configuration Debug \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              build
            mkdir -p "$CM_BUILD_DIR/build/ios/ipa/Payload"
            APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" -maxdepth 5 2>/dev/null | head -n 1)
            if [ -n "$APP_PATH" ]; then
              cp -R "$APP_PATH" "$CM_BUILD_DIR/build/ios/ipa/Payload/"
              cd "$CM_BUILD_DIR/build/ios/ipa"
              zip -qr mobile.ipa Payload
              rm -rf Payload
            fi
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
