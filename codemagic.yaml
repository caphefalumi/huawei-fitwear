# Fitwear mobile CI — APK + IPA via Codemagic
# Pipeline diagram: docs/ci/codemagic-mobile-pipeline.md
#
# Requires (Codemagic UI):
#   - Android: none for debug APK; upload keystore for release AAB/APK
#   - iOS: code signing identities + provisioning for com.fitwear.mobile

workflows:
  mobile-android-apk:
    name: Mobile Android APK
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 17
      vars:
        PACKAGE_NAME: com.fitwear.mobile
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install Bun
        script: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $CM_ENV
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun --version
      - name: Install dependencies and typecheck
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install
          cd apps/mobile && bunx tsc --noEmit
      - name: Expo prebuild (Android, includes ble-plx native)
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          cd apps/mobile
          bunx expo prebuild --platform android --clean
      - name: Point Gradle at Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/apps/mobile/android/local.properties"
      - name: Build debug APK
        script: |
          cd "$CM_BUILD_DIR/apps/mobile/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p "$CM_BUILD_DIR/build/android"
          cp -f app/build/outputs/apk/debug/*.apk "$CM_BUILD_DIR/build/android/" || true
          ls -la "$CM_BUILD_DIR/build/android"
    artifacts:
      - build/android/*.apk
      - apps/mobile/android/app/build/outputs/apk/**/*.apk
      - apps/mobile/android/app/build/outputs/apk/**/*.aab

  mobile-ios-ipa:
    name: Mobile iOS IPA
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: com.fitwear.mobile
      vars:
        XCODE_WORKSPACE: mobile.xcworkspace
        XCODE_SCHEME: mobile
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install Bun
        script: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $CM_ENV
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun --version
      - name: Install dependencies and typecheck
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install
          cd apps/mobile && bunx tsc --noEmit
      - name: Expo prebuild (iOS, includes ble-plx native)
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          cd apps/mobile
          bunx expo prebuild --platform ios --clean
      - name: CocoaPods install
        script: |
          cd "$CM_BUILD_DIR/apps/mobile/ios"
          pod install --repo-update
      - name: Build IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR/apps/mobile/ios"
          mkdir -p "$CM_BUILD_DIR/build/ios"

          if which xcode-project >/dev/null 2>&1 && [ -n "${CM_CERTIFICATE:-}" ]; then
            xcode-project use-profiles
            xcode-project build-ipa \
              --workspace "$XCODE_WORKSPACE" \
              --scheme "$XCODE_SCHEME"
            find "$CM_BUILD_DIR" -name "*.ipa" -print -exec cp -f {} "$CM_BUILD_DIR/build/ios/" \;
          else
            # Unsigned device build for CI verification when signing is not configured
            xcodebuild \
              -workspace "$XCODE_WORKSPACE" \
              -scheme "$XCODE_SCHEME" \
              -configuration Debug \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$CM_BUILD_DIR/build/ios/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              build
            APP_PATH=$(find "$CM_BUILD_DIR/build/ios/DerivedData" -name "*.app" -type d | head -n 1)
            if [ -z "$APP_PATH" ]; then
              echo "No .app produced"
              exit 1
            fi
            mkdir -p "$CM_BUILD_DIR/build/ios/ipa/Payload"
            cp -R "$APP_PATH" "$CM_BUILD_DIR/build/ios/ipa/Payload/"
            (
              cd "$CM_BUILD_DIR/build/ios/ipa"
              zip -qr "$CM_BUILD_DIR/build/ios/mobile-unsigned.ipa" Payload
            )
            ls -la "$CM_BUILD_DIR/build/ios"
          fi
    artifacts:
      - build/ios/*.ipa
      - build/ios/**/*.app
      - /tmp/xcodebuild_logs/*.log
