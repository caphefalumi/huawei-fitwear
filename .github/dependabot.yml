# Dependabot version updates
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Bun workspaces: apps/mobile and apps/backend share the root bun.lock
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Backend: Elysia core and plugins move together
      elysia:
        patterns:
          - "elysia"
          - "@elysiajs/*"
      # Backend: Wrangler and Cloudflare tooling
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      # Mobile: Expo and React Native packages move together
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react-native"
          - "react-native-*"
        update-types:
          - "minor"
          - "patch"
      # Everything else
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Upgrade the Expo SDK manually so versions stay compatible
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows (CI and Cloudflare deploy)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
