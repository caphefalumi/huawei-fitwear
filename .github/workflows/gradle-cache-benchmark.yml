name: Gradle Cache Benchmark
run-name: Gradle cache ${{ inputs.phase }} (${{ inputs.benchmark_id }})

on:
  workflow_dispatch:
    inputs:
      benchmark_id:
        description: Unique experiment ID; reuse only for its cold/warm pair on the same SHA
        required: true
        type: string
      phase:
        description: Run cold first, wait for completion, then warm without changing the ref
        required: true
        type: choice
        options:
          - cold
          - warm

permissions:
  contents: read

concurrency:
  group: gradle-cache-benchmark-${{ github.ref }}-${{ inputs.benchmark_id }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.strategy }} (${{ inputs.phase }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        strategy: [manual, setup-gradle]
        # setup-gradle includes the matrix in its cache identity. Do NOT put
        # phase here: cold and warm must use the same workflow/job/matrix/SHA.
        benchmark_id: ["${{ inputs.benchmark_id }}"]
    env:
      BENCHMARK_ID: ${{ matrix.benchmark_id }}
      BENCHMARK_PHASE: ${{ inputs.phase }}
      BENCHMARK_STRATEGY: ${{ matrix.strategy }}
      EXPO_PUBLIC_API_URL: https://fitwear.tm-project.id.vn/
      BENCHMARK_ARTIFACTS: ${{ github.workspace }}/gradle-benchmark-artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Initialize benchmark artifacts
        run: |
          mkdir -p "$BENCHMARK_ARTIFACTS"
          touch "$BENCHMARK_ARTIFACTS/gradle.log"
          bun -e 'if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$/.test(process.env.BENCHMARK_ID)) throw new Error("benchmark_id must be 1-80 letters, digits, dots, underscores or hyphens, starting with a letter or digit")'
          echo "MANUAL_CACHE_KEY=gradle-benchmark-${BENCHMARK_ID}-${RUNNER_OS}-${RUNNER_ARCH}-${GITHUB_SHA}-manual" >> "$GITHUB_ENV"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Setup Java for Android build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          # No setup-java cache or other overlapping Gradle caches.

      - name: Generate Android project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install

      # Cold deliberately skips restore. Use a NEW benchmark_id for each
      # experiment: existing immutable keys would otherwise retain old data.
      - name: Restore manual Gradle cache
        id: manual-restore
        if: matrix.strategy == 'manual' && inputs.phase == 'warm'
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.MANUAL_CACHE_KEY }}
          fail-on-cache-miss: true
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/**/*.lock
            !~/.gradle/**/*.lck
            !~/.gradle/**/gc.properties

      - name: Require exact manual cache hit
        if: matrix.strategy == 'manual' && inputs.phase == 'warm'
        env:
          CACHE_HIT: ${{ steps.manual-restore.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true

      - name: Setup Gradle with default enhanced provider
        if: matrix.strategy == 'setup-gradle'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-write-only: ${{ inputs.phase == 'cold' }}
          cache-read-only: ${{ inputs.phase == 'warm' }}
          # Experimental: benchmark-only isolation from unrelated jobs/matrices.
          gradle-home-cache-strict-match: true
          # Keep the enhanced provider and all other defaults. setup-gradle also
          # supplies wrapper validation/init scripts/cleanup; manual caching does
          # not. This compares the real approaches, not just archive formats.

      - name: Build Android release APK
        id: gradle-build
        working-directory: apps/mobile/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          started=$(date +%s%N)
          set +e
          ./gradlew assembleRelease --no-daemon --build-cache --console=plain --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" -Pandroid.enableMinifyInReleaseBuilds=false -PreactNativeArchitectures=x86_64 2>&1 | tee "$BENCHMARK_ARTIFACTS/gradle.log"
          status=${PIPESTATUS[0]}
          set -e
          finished=$(date +%s%N)
          echo "duration_ns=$((finished - started))" >> "$GITHUB_OUTPUT"
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Save manual Gradle cache
        if: success() && matrix.strategy == 'manual' && inputs.phase == 'cold'
        uses: actions/cache/save@v6
        with:
          key: ${{ env.MANUAL_CACHE_KEY }}
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/**/*.lock
            !~/.gradle/**/*.lck
            !~/.gradle/**/gc.properties

      - name: Record benchmark metadata
        if: always()
        env:
          BUILD_DURATION_NS: ${{ steps.gradle-build.outputs.duration_ns }}
          BUILD_EXIT_STATUS: ${{ steps.gradle-build.outputs.exit_status }}
          BUILD_OUTCOME: ${{ steps.gradle-build.outcome }}
          MANUAL_CACHE_HIT: ${{ steps.manual-restore.outputs.cache-hit }}
        run: |
          bun --eval '
            const env = process.env;
            const directory = env.BENCHMARK_ARTIFACTS;
            const file = Bun.file(`${directory}/gradle.log`);
            const log = await file.exists() ? await file.text() : "";
            const metadata = {
              sha: env.GITHUB_SHA,
              phase: env.BENCHMARK_PHASE,
              strategy: env.BENCHMARK_STRATEGY,
              namespace: env.BENCHMARK_ID,
              runner_os: env.RUNNER_OS,
              runner_arch: env.RUNNER_ARCH,
              runner_image: env.ImageOS ?? null,
              runner_image_version: env.ImageVersion ?? null,
              runner_cpus: require("node:os").cpus().length,
              runner_memory_bytes: require("node:os").totalmem(),
              gradle_max_workers: 2,
              gradle_jvm_args: "-Xmx4g -XX:MaxMetaspaceSize=1g",
              gradle_build_seconds: env.BUILD_DURATION_NS ? Number(env.BUILD_DURATION_NS) / 1e9 : null,
              gradle_exit_status: env.BUILD_EXIT_STATUS ? Number(env.BUILD_EXIT_STATUS) : null,
              gradle_step_outcome: env.BUILD_OUTCOME,
              from_cache_tasks: (log.match(/^> Task .+ FROM-CACHE\r?$/gm) ?? []).length,
              up_to_date_tasks: (log.match(/^> Task .+ UP-TO-DATE\r?$/gm) ?? []).length,
              manual_cache_key: env.BENCHMARK_STRATEGY === "manual" ? env.MANUAL_CACHE_KEY : null,
              manual_cache_hit: env.MANUAL_CACHE_HIT === "true",
              run_id: env.GITHUB_RUN_ID,
              run_attempt: env.GITHUB_RUN_ATTEMPT
            };
            await Bun.write(`${directory}/metadata.json`, JSON.stringify(metadata, null, 2) + "\n");
          '

      - name: Upload benchmark log and metadata
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-cache-${{ matrix.benchmark_id }}-${{ inputs.phase }}-${{ matrix.strategy }}-${{ github.run_attempt }}
          path: gradle-benchmark-artifacts/
          if-no-files-found: error
