name: Mobile Build

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  EXPO_NONINTERACTIVE: "1"
  APP_NAME: VoocHealth

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            timeout: 45
            artifact: fitwear-android-debug-apk
            path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          - platform: ios
            os: macos-latest
            timeout: 60
            artifact: fitwear-ios-simulator-app
            path: apps/mobile/build/ios/mobile-ios-simulator.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Android toolchain
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        if: matrix.platform == 'android'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        if: matrix.platform == 'android'
        with:
          packages: "platform-tools cmake;3.31.6"

      # Shared: one prebuild step driven by the matrix
      - name: Generate native project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ${{ matrix.platform }} --no-install

      # Android build
      - name: Build debug APK
        if: matrix.platform == 'android'
        working-directory: apps/mobile/android
        run: >-
          ./gradlew
          --build-cache
          -PreactNativeArchitectures=arm64-v8a,x86_64
          assembleDebug

      # iOS build
      - name: Cache CocoaPods
        if: matrix.platform == 'ios'
        uses: actions/cache@v4 # pin to a commit SHA like your other actions
        with:
          path: apps/mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/mobile/app.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        if: matrix.platform == 'ios'
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build for iOS Simulator
        if: matrix.platform == 'ios'
        working-directory: apps/mobile
        run: >-
          xcodebuild
          -workspace "ios/$APP_NAME.xcworkspace"
          -scheme "$APP_NAME"
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package app
        if: matrix.platform == 'ios'
        working-directory: apps/mobile
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "build/ios/Build/Products/Debug-iphonesimulator/$APP_NAME.app"
          build/ios/mobile-ios-simulator.zip

      # Shared: one upload step driven by the matrix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
