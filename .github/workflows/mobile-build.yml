name: Mobile Build

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build Android debug APK
        type: boolean
        default: false
      build_ios:
        description: Build iOS Simulator app
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  EXPO_NONINTERACTIVE: "1"

jobs:
  android:
    name: Build Android
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Generate native project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools cmake;3.31.6"

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew --build-cache assembleDebug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fitwear-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Build iOS Simulator
    if: ${{ inputs.build_ios }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Generate native project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build for iOS Simulator
        working-directory: apps/mobile
        run: >-
          xcodebuild
          -workspace ios/mobile.xcworkspace
          -scheme mobile
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package app
        working-directory: apps/mobile
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          build/ios/Build/Products/Debug-iphonesimulator/mobile.app
          build/ios/mobile-ios-simulator.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fitwear-ios-simulator-app
          path: apps/mobile/build/ios/mobile-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
