name: Mobile Build

on:
  schedule:
    - cron: "0 1 * * *"
      timezone: Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  EXPO_NONINTERACTIVE: "1"
  APP_NAME: VoocHealth # must match "name" in app.json
  EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_HOST }}
  EXPO_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.EXPO_PUBLIC_POSTHOG_PROJECT_TOKEN }}

jobs:
  build:
    name: Release ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            timeout: 90
            artifact: app-release.apk
            path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          - platform: ios
            os: macos-latest
            timeout: 75
            artifact: app-release.ipa
            path: apps/mobile/build/ios/app-release.ipa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        if: matrix.platform == 'android'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        if: matrix.platform == 'android'
        with:
          packages: "platform-tools cmake;3.31.6"

      - name: Generate native project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ${{ matrix.platform }} --no-install

      - name: Build release APK
        if: matrix.platform == 'android'
        working-directory: apps/mobile/android
        run: ./gradlew --build-cache assembleRelease

      # Prebuild writes ios/ fresh on every run and no Podfile.lock is committed,
      # so key on the generated Podfile and the JS lockfile (native modules come
      # from node_modules). Pods/Manifest.lock lets pod install reuse unchanged
      # pods, the restored Podfile.lock keeps resolution stable, and the
      # download cache covers pods that did change.
      - name: Cache CocoaPods
        if: matrix.platform == 'ios'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/mobile/ios/Pods
            apps/mobile/ios/Podfile.lock
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/mobile/ios/Podfile', 'apps/mobile/ios/Podfile.properties.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # ccache reuses compiled C, Objective-C and C++ between runs; Swift is not
      # cached. React Native's wrapper (scripts/xcode/ccache-clang.sh) supplies the
      # Xcode-specific sloppiness settings; these env vars add location and size.
      - name: Install ccache
        if: matrix.platform == 'ios'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install ccache
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"

      # A new key every run saves the cache this build filled; restore-keys
      # starts each build from the most recent one.
      - name: Cache ccache
        if: matrix.platform == 'ios'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # USE_CCACHE=1 makes the Expo Podfile route CC/CXX/LD through ccache.
      - name: Install CocoaPods dependencies
        if: matrix.platform == 'ios'
        working-directory: apps/mobile/ios
        env:
          USE_CCACHE: "1"
        run: pod install

      - name: Archive iOS app (unsigned)
        if: matrix.platform == 'ios'
        working-directory: apps/mobile
        run: |
          ccache --zero-stats
          xcodebuild archive \
            -workspace "ios/$APP_NAME.xcworkspace" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          ccache --show-stats

      - name: Package IPA
        if: matrix.platform == 'ios'
        working-directory: apps/mobile/build/ios
        run: |
          mkdir Payload
          cp -R "app.xcarchive/Products/Applications/$APP_NAME.app" Payload/
          app="Payload/$APP_NAME.app"
          # An unsigned build carries no entitlements, so HealthKit fails after sideloading.
          # Ad-hoc sign it so the re-signing tool can read them.
          if [[ -d "$app/Frameworks" ]]; then
            find "$app/Frameworks" -mindepth 1 -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - --entitlements "../../ios/$APP_NAME/$APP_NAME.entitlements" "$app"
          codesign --display --entitlements - "$app" | grep com.apple.developer.healthkit
          zip -qry app-release.ipa Payload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          archive: false
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
