name: Mobile CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.manual_scope.outputs.mobile || steps.merge_scope.outputs.mobile || steps.filter.outputs.mobile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          token: ${{ github.token }}
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'apps/backend/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'
      - name: Run mobile suite when manually dispatched
        id: manual_scope
        if: github.event_name == 'workflow_dispatch'
        run: echo "mobile=true" >> "$GITHUB_OUTPUT"
      - name: Run mobile suite for merge group
        id: merge_scope
        if: github.event_name == 'merge_group'
        run: echo "mobile=true" >> "$GITHUB_OUTPUT"

  mobile:
    name: Mobile tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck mobile
        run: bun run --cwd apps/mobile typecheck

      - name: Install Playwright browser
        working-directory: apps/mobile
        run: bunx playwright install --with-deps chromium

      - name: Run mobile unit and end-to-end tests
        run: bun run --cwd apps/mobile test && bun run --cwd apps/mobile test:e2e

  required:
    name: Mobile checks
    if: always()
    needs: [changes, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if mobile checks failed
        if: >-
          ${{
            needs.changes.result != 'success' ||
            (needs.mobile.result != 'success' && needs.mobile.result != 'skipped')
          }}
        run: exit 1
      - name: Pass when mobile checks succeed or are unaffected
        if: >-
          ${{
            needs.changes.result == 'success' &&
            (needs.mobile.result == 'success' || needs.mobile.result == 'skipped')
          }}
        run: echo "Mobile checks passed or were not affected."
