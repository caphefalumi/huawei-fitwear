name: Mobile CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.manual_scope.outputs.mobile || steps.merge_scope.outputs.mobile || steps.filter.outputs.mobile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          token: ${{ github.token }}
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'apps/backend/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'
      - name: Run mobile suite when manually dispatched
        id: manual_scope
        if: github.event_name == 'workflow_dispatch'
        run: echo "mobile=true" >> "$GITHUB_OUTPUT"
      - name: Run mobile suite for merge group
        id: merge_scope
        if: github.event_name == 'merge_group'
        run: echo "mobile=true" >> "$GITHUB_OUTPUT"

  mobile:
    name: Mobile tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Node.js for Jest ESM
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck mobile
        run: bun run --cwd apps/mobile typecheck
      - name: Run mobile Jest unit tests
        run: bun run --cwd apps/mobile test

      - name: Setup Java for Android E2E
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro CLI
        run: |
          export MAESTRO_VERSION=2.12.0
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Apply local D1 migrations
        run: bun run --cwd apps/backend db:migrate:local

      - name: Start local backend
        run: |
          bun run --cwd apps/backend dev --local --ip 0.0.0.0 --port 8787 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then
              echo "Local backend is ready."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/wrangler.log"
          exit 1

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8787
        run: bunx expo prebuild --platform android --no-install

      - name: Build Android debug APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8787
        run: ./gradlew assembleDebug --no-daemon

      - name: Run the single Maestro end-to-end flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test apps/mobile/.maestro/fitness.yaml

  required:
    name: Mobile checks
    if: always()
    needs: [changes, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if mobile checks failed
        if: >-
          ${{
            needs.changes.result != 'success' ||
            (needs.mobile.result != 'success' && needs.mobile.result != 'skipped')
          }}
        run: exit 1
      - name: Pass when mobile checks succeed or are unaffected
        if: >-
          ${{
            needs.changes.result == 'success' &&
            (needs.mobile.result == 'success' || needs.mobile.result == 'skipped')
          }}
        run: echo "Mobile checks passed or were not affected."
