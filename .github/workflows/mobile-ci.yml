name: Mobile CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect mobile changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/mobile-ci.yml'

      - name: Setup Bun
        if: steps.filter.outputs.mobile == 'true' || github.event_name != 'pull_request'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        if: steps.filter.outputs.mobile == 'true' || github.event_name != 'pull_request'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Node.js
        if: steps.filter.outputs.mobile == 'true' || github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install workspace dependencies
        if: steps.filter.outputs.mobile == 'true' || github.event_name != 'pull_request'
        run: bun install --frozen-lockfile

      - name: Typecheck mobile
        if: steps.filter.outputs.mobile == 'true' || github.event_name != 'pull_request'
        run: bun run --cwd apps/mobile typecheck

      - name: Run mobile Jest unit tests
        if: steps.filter.outputs.mobile == 'true' || github.event_name != 'pull_request'
        run: bun run --cwd apps/mobile test

      - name: Skip notice
        if: steps.filter.outputs.mobile != 'true' && github.event_name == 'pull_request'
        run: echo "No mobile changes detected. Mobile tests skipped."
