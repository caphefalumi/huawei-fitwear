name: Lint

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed applications
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.merge_scope.outputs.backend || steps.filter.outputs.backend }}
      mobile: ${{ steps.merge_scope.outputs.mobile || steps.filter.outputs.mobile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          token: ${{ github.token }}
          filters: |
            backend:
              - 'apps/backend/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'
            mobile:
              - 'apps/mobile/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'
      - name: Run all lint checks for merge group
        id: merge_scope
        if: github.event_name == 'merge_group'
        run: |
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "mobile=true" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend Oxlint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Lint backend
        run: bun run --cwd apps/backend lint

  mobile:
    name: Mobile Oxlint
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Lint mobile
        run: bun run --cwd apps/mobile lint

  required:
    name: Lint checks
    if: always()
    needs: [changes, backend, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any affected lint job failed
        if: >-
          ${{
            needs.changes.result != 'success' ||
            (needs.backend.result != 'success' && needs.backend.result != 'skipped') ||
            (needs.mobile.result != 'success' && needs.mobile.result != 'skipped')
          }}
        run: exit 1
      - name: Pass when affected lint jobs succeed or skip
        if: >-
          ${{
            needs.changes.result == 'success' &&
            (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
            (needs.mobile.result == 'success' || needs.mobile.result == 'skipped')
          }}
        run: echo "Affected lint checks passed."
