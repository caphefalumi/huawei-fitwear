name: Lint

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect lint changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lint:
              - 'apps/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/lint.yml'

      - name: Setup Bun
        if: steps.filter.outputs.lint == 'true' || github.event_name != 'pull_request'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        if: steps.filter.outputs.lint == 'true' || github.event_name != 'pull_request'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install workspace dependencies
        if: steps.filter.outputs.lint == 'true' || github.event_name != 'pull_request'
        run: bun install --frozen-lockfile

      - name: Lint all workspaces
        if: steps.filter.outputs.lint == 'true' || github.event_name != 'pull_request'
        run: bun run lint

      - name: Skip notice
        if: steps.filter.outputs.lint != 'true' && github.event_name == 'pull_request'
        run: echo "No lint changes detected. Lint skipped."
