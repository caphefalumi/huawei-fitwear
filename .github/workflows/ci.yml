name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Non-PR events (merge queue, push, dispatch) always run everything.
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      mobile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mobile == 'true' }}
      lint: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lint == 'true' }}
    steps:
      # On PRs this uses the API, so no checkout is needed.
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            mobile:
              - 'apps/mobile/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            lint:
              - 'apps/**'
              - 'package.json'
              - 'bun.lock'
              - '.oxlintrc*'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run fmt:check

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run lint

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: bun run backend:typecheck
      - name: Unit and integration tests
        run: bun run --cwd apps/backend test:all
      - name: Build deployment bundle
        run: bun run backend:build

  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
      - name: Typecheck
        run: bun run mobile:typecheck
      - name: Jest unit tests
        run: bun run mobile:test

  # The only check to mark as required in branch protection.
  # Skipped jobs (unchanged paths) pass; failed or cancelled jobs fail it.
  ci-pass:
    name: CI passed
    if: always()
    needs: [changes, format, lint, backend, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            exit 1
          fi
