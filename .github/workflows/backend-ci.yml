name: Backend CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.merge_scope.outputs.backend || steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          token: ${{ github.token }}
          filters: |
            backend:
              - 'apps/backend/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'
      - name: Run backend suite for merge group
        id: merge_scope
        if: github.event_name == 'merge_group'
        run: echo "backend=true" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck backend
        run: bun run --cwd apps/backend typecheck

      - name: Install Playwright browser
        working-directory: apps/backend
        run: bunx playwright install --with-deps chromium

      - name: Run backend unit, integration, and end-to-end tests
        run: bun run --cwd apps/backend test:all

  required:
    name: Backend checks
    if: always()
    needs: [changes, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if backend checks failed
        if: >-
          ${{
            needs.changes.result != 'success' ||
            (needs.backend.result != 'success' && needs.backend.result != 'skipped')
          }}
        run: exit 1
      - name: Pass when backend checks succeed or are unaffected
        if: >-
          ${{
            needs.changes.result == 'success' &&
            (needs.backend.result == 'success' || needs.backend.result == 'skipped')
          }}
        run: echo "Backend checks passed or were not affected."
