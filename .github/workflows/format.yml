name: Format

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting for changed files
        run: |
          base_sha="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          files=$(git diff --name-only --diff-filter=ACMR "$base_sha...HEAD" -- apps/mobile apps/backend package.json bun.lock .github/workflows)
          while IFS= read -r file; do
            case "$file" in
              *.js|*.jsx|*.ts|*.tsx|*.json|*.jsonc|*.yml|*.yaml|*.css|*.scss|*.html) bunx oxfmt --check "$file" ;;
            esac
          done <<< "$files"
