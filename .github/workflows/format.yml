name: Auto-format

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-format-main
  cancel-in-progress: false

jobs:
  format:
    name: Format main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ secrets.VOOC_APP_TOKEN }}
      - uses: ./.github/actions/setup
      - run: bun run fmt
      - name: Commit and push formatting changes
        run: |
          git add -u
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "VoocBot"
          git config user.email "VoocBot@users.noreply.github.com"
          git commit -m "style: auto-format"
          git push origin HEAD:main
