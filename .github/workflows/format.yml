name: Auto-format

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-format-main
  cancel-in-progress: false

jobs:
  format:
    name: Format main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup

      - run: bun run fmt
      - name: Install ArkTS formatter
        run: cargo install --git https://github.com/ohos-rs/oxc-ark --rev 25ca00609724a45f8bb2804390d04c397cf45044 --locked oxk
      - name: Format watch ArkTS
        run: |
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          oxk format --config .github/arkts-format.json 'apps/watch/entry/src/**/*.ets' 2>"$log"
          if [ -s "$log" ]; then
            cat "$log"
            exit 1
          fi
      - name: Commit and push formatting changes
        run: |
          git add -u
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "vooc[bot]"
          git config user.email "356118716+voocbot[bot]@users.noreply.github.com"
          git commit -m "style: auto-format"
          git push origin HEAD:main
