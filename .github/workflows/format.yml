name: Auto-format

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-format-main
  cancel-in-progress: false

jobs:
  format:
    name: Format main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      # oxk's npm CLI needs Node.js ^20.19.0 or >=22.18.0.
      - uses: ./.github/actions/setup
        with:
          node: "true"

      # oxfmt for TypeScript, JSON and Markdown, then oxk for the watch's ArkTS.
      # oxk exits non-zero on a file it cannot parse, which fails this step.
      - name: Format repository
        run: bun run fmt
      - name: Commit and push formatting changes
        run: |
          git add -u
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "vooc[bot]"
          git config user.email "356118716+voocbot[bot]@users.noreply.github.com"
          git commit -m "style: auto-format"
          git push origin HEAD:main
