name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  exercise-gifs:
    name: Deploy exercise GIFs
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Upload new or changed exercise GIFs to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -d assets/exercise-loops ]] || exit 0

          bucket=voochealth-exercise-gifs
          # Hashes of the GIFs already in R2, written only after every upload succeeds.
          manifest="$bucket/exercise-loops/manifest.sha256"
          previous="$RUNNER_TEMP/previous.sha256"
          current="$RUNNER_TEMP/current.sha256"
          changed="$RUNNER_TEMP/changed.sha256"

          put() {
            local attempt
            for attempt in 1 2 3; do
              bunx wrangler r2 object put "$1" --file "$2" --content-type "$3" --remote </dev/null && return 0
              sleep $((attempt * 5))
            done
            return 1
          }

          find assets/exercise-loops -type f -name '*.gif' -print0 | sort -z | xargs -0 -r sha256sum > "$current"
          # Without a readable manifest, upload everything.
          bunx wrangler r2 object get "$manifest" --file "$previous" --remote || : > "$previous"
          grep -Fxv -f "$previous" "$current" > "$changed" || true

          if [[ ! -s "$changed" ]]; then
            echo "No new or changed GIFs."
            exit 0
          fi

          while read -r _ file; do
            put "$bucket/${file#assets/}" "$file" image/gif
          done < "$changed"
          put "$manifest" "$current" text/plain

  deploy-staging:
    name: Migrate and deploy staging backend
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.E2E_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Validate Worker bindings before migration
        working-directory: apps/backend
        run: bunx wrangler deploy --env staging --dry-run

      - name: Apply Cloudflare D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --cwd apps/backend db:migrate:staging

      - name: Seed USDA catalog in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/backend
        run: bunx wrangler d1 execute fitwear-d1-staging --env staging --remote --file scripts/usda_food_catalog.sql

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --cwd apps/backend deploy:staging

      - name: Smoke test
        env:
          API_URL: ${{ vars.E2E_API_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --output /dev/null "${API_URL%/}/swagger/json"

  deploy:
    name: Migrate and deploy backend
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Validate Resend templates and release credentials
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [[ -z "$RESEND_API_KEY" ]]; then
            echo "::error::RESEND_API_KEY is required for production release."
            exit 1
          fi
          bun apps/backend/scripts/sync-resend-templates.ts --dry-run

      - name: Validate Worker bindings before migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run backend:build

      - name: Apply Cloudflare D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run db:migrate:remote

      - name: Seed USDA catalog in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/backend
        run: bunx wrangler d1 execute fitwear-d1 --remote --file scripts/usda_food_catalog.sql

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run backend:deploy

      - name: Smoke test
        if: ${{ vars.PRODUCTION_HEALTH_URL != '' }}
        env:
          HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$HEALTH_URL"

      - name: Sync and publish Resend email templates
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: bun apps/backend/scripts/sync-resend-templates.ts
