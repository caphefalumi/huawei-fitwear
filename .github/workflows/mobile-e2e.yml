name: Mobile E2E

# No pull_request or merge_group triggers. Nightly runs use main; manual runs
# may use any branch (Actions > Mobile E2E > Run workflow > pick the branch).
# Push is limited to the release-build branch so that fix can be proven before merge.
on:
  schedule:
    - cron: "0 1 * * *"
      timezone: Asia/Ho_Chi_Minh
  push:
    branches:
      - feat/build-mobile
  workflow_dispatch:
    inputs:
      include_tags:
        description: Comma-separated test tags (any match); blank runs every test
        type: string
      provision_account:
        description: One-time creation of the dedicated account in an empty staging user table
        type: boolean
      force_rebuild:
        description: Bypass APK cache and build from source
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-e2e-dedicated-account
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  APK_DIR: apps/mobile/android/app/build/outputs/apk/release
  APK_ARTIFACT: fitwear-release-apk
  # e2e only accepts an --output directory inside its project (apps/mobile).
  E2E_ARTIFACTS: apps/mobile/e2e-artifacts

jobs:
  validate:
    name: Validate isolated staging configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      E2E_API_URL: ${{ vars.E2E_API_URL }}
      E2E_D1_DATABASE_ID: ${{ secrets.E2E_D1_DATABASE_ID }}
      E2E_TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # Staging credentials stay on trusted refs. A manual run may use any
      # branch: only people with write access can dispatch it. Automatic runs
      # (schedule, push) stay on main and feat/build-mobile.
      - name: Restrict automatic E2E runs to trusted branches
        if: >-
          github.event_name != 'workflow_dispatch' &&
          github.ref != 'refs/heads/main' &&
          github.ref != 'refs/heads/feat/build-mobile'
        run: |
          echo "::error::Automatic Mobile E2E runs must use main or feat/build-mobile; start other branches manually."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Check E2E configuration and isolation
        run: bun .github/scripts/validate-e2e-environment.ts

      - name: Check whether staging database is empty
        id: staging-database
        run: bun .github/scripts/check-empty-staging.ts

      - name: Install dependencies to initialize empty staging
        if: steps.staging-database.outputs.empty == 'true' || inputs.provision_account
        run: bun install --frozen-lockfile

      - name: Apply migrations to empty staging database
        if: steps.staging-database.outputs.empty == 'true'
        run: bun run --cwd apps/backend db:migrate:staging

      - name: Provision dedicated account in empty staging
        if: inputs.provision_account
        run: bun .github/scripts/provision-e2e-account.ts

      - name: Check staging account and schema before building
        env:
          E2E_CLEANUP_STATE: ${{ runner.temp }}/e2e-preflight.json
        run: bun .github/scripts/cleanup-e2e-account.ts snapshot

  build:
    name: Build Android release APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.E2E_API_URL }}
      EXPO_NO_TELEMETRY: "1"
      EXPO_NONINTERACTIVE: "1"
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fingerprint Android APK build inputs
        id: fingerprint
        run: |
          # Tracked mobile code and dependencies, excluding tests/docs.
          # The staging API URL is bundled into the APK, so include it.
          key="$({ git ls-files -s -z -- \
            apps/mobile package.json bun.lock .github/workflows/mobile-e2e.yml .github/actions/setup/action.yml \
            ':(exclude)apps/mobile/e2e/**' \
            ':(exclude)apps/mobile/e2e.config.ts' \
            ':(exclude)apps/mobile/docs/**' \
            ':(exclude)apps/mobile/src/test-utils/**' \
            ':(exclude,glob)apps/mobile/src/**/__tests__/**' \
            ':(exclude)apps/mobile/jest.config.ts' \
            ':(exclude)apps/mobile/jest-setup.ts' \
            ':(exclude)apps/mobile/README.md'; \
            printf '%s' "$EXPO_PUBLIC_API_URL"; } | sha256sum | cut -d' ' -f1)"
          echo "cache-key=android-e2e-apk-v1-${RUNNER_OS}-${key}" >> "$GITHUB_OUTPUT"

      - name: Restore APK with identical build inputs
        id: apk-cache
        if: ${{ !inputs.force_rebuild }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.APK_DIR }}/app-release.apk
          key: ${{ steps.fingerprint.outputs.cache-key }}

      - name: Setup workspace
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup

      - name: Setup Java
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Android project
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install

      # Android 14 samples GWP-ASan on some launches, and its stack walk segfaults
      # on Hermes fiber stacks on x86_64 (meta/hermes#1873). Emulator APK only.
      - name: Turn off GWP-ASan in the emulator build
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android/app/src/main
        run: |
          sed -i 's/<application /<application android:gwpAsanMode="never" /' AndroidManifest.xml
          grep -q 'android:gwpAsanMode="never"' AndroidManifest.xml

      - name: Setup Gradle
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Build Android release APK for emulator
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --build-cache -Pandroid.enableMinifyInReleaseBuilds=false -PreactNativeArchitectures=x86_64

      - name: Save APK for future test-only changes
        if: steps.apk-cache.outputs.cache-hit != 'true' && !inputs.force_rebuild
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.APK_DIR }}/app-release.apk
          key: ${{ steps.fingerprint.outputs.cache-key }}

      - name: Record Android build or reuse
        env:
          CACHE_HIT: ${{ steps.apk-cache.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == "true" ]]; then
            echo "### Android APK: reused cache for identical build inputs" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Android APK: fresh build from source" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK from this commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: ${{ env.APK_DIR }}/app-release.apk
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Android E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_TELEMETRY_DISABLED: "1"
      E2E_D1_DATABASE_ID: ${{ secrets.E2E_D1_DATABASE_ID }}
      E2E_TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The e2e runner (e2e + @e2e-dev/mobile) needs Node.js 22.22.3+ or 24.8+.
      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          node: "true"

      - name: Verify E2E helper tests
        run: >-
          bun test
          ./.github/scripts/generate-e2e-summary.test.ts
          ./.github/scripts/cleanup-e2e-account.test.ts
          ./.github/scripts/validate-e2e-environment.test.ts

      - name: Download APK from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: ${{ env.APK_DIR }}

      - name: Enable KVM acceleration
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::Android KVM acceleration is not available."
            exit 1
          fi
          sudo chmod 666 /dev/kvm

      - name: Snapshot staging E2E account
        id: snapshot-account
        env:
          E2E_CLEANUP_STATE: ${{ runner.temp }}/e2e-account.json
        run: bun .github/scripts/cleanup-e2e-account.ts snapshot

      # run-e2e-android.sh records E2E_EXIT_CODE in GITHUB_ENV and always exits 0,
      # so the cleanup, upload and report steps below still run.
      - name: Run e2e tests on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          E2E_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
          E2E_TAGS: ${{ inputs.include_tags }}
        with:
          api-level: 34
          # expo-camera refuses to read barcodes from photos without Play services.
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -accel on -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/run-e2e-android.sh

      - name: Clean up staging account
        if: always() && steps.snapshot-account.outcome == 'success'
        env:
          E2E_CLEANUP_STATE: ${{ runner.temp }}/e2e-account.json
        run: bun .github/scripts/cleanup-e2e-account.ts cleanup

      - name: Upload recording videos
        id: upload-recording
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fitwear-e2e-recording-${{ github.run_attempt }}
          # One <test>__<attempt>.mp4 per e2e test, collected by run-e2e-android.sh.
          path: ${{ env.E2E_ARTIFACTS }}/recordings/*.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Upload JUnit, screenshots, and diagnostics
        id: upload-artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-e2e-artifacts-${{ github.run_attempt }}
          # Videos are already in the recording artifact above.
          path: |
            ${{ env.E2E_ARTIFACTS }}/
            !${{ env.E2E_ARTIFACTS }}/recordings/**
          if-no-files-found: warn
          retention-days: 7

      - name: Publish E2E results
        if: always()
        env:
          RECORDING_URL: ${{ steps.upload-recording.outputs.artifact-url }}
          ARTIFACTS_URL: ${{ steps.upload-artifacts.outputs.artifact-url }}
        run: bun .github/scripts/generate-e2e-summary.ts "$E2E_ARTIFACTS"

      - name: Require passing E2E run and valid JUnit
        if: always()
        run: bun .github/scripts/verify-e2e-result.ts "$E2E_ARTIFACTS"
