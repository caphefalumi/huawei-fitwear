name: Mobile E2E

# No pull_request, push, or merge_group triggers: E2E is manual and nightly only.
on:
  schedule:
    - cron: "0 1 * * *"
      timezone: Asia/Ho_Chi_Minh
  workflow_dispatch:
    inputs:
      include_tags:
        description: Comma-separated Maestro tags (OR); blank runs all top-level flows
        required: false
        type: string
        default: ""
      force_rebuild:
        description: Bypass APK cache and build from source
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-e2e-dedicated-account
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate isolated staging configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restrict E2E dispatch to main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Mobile E2E runs must use main (trusted code with staging credentials)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Check E2E configuration and isolation
        env:
          E2E_API_URL: ${{ vars.E2E_API_URL }}
          E2E_D1_DATABASE_ID: ${{ secrets.E2E_D1_DATABASE_ID }}
          MAESTRO_TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
          MAESTRO_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun .github/scripts/validate-e2e-environment.ts

  build:
    name: Build Android release APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.E2E_API_URL }}
      EXPO_NO_TELEMETRY: "1"
      EXPO_NONINTERACTIVE: "1"
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fingerprint Android APK build inputs
        id: fingerprint
        run: |
          # Tracked mobile code and dependencies, excluding tests/docs.
          # The staging API URL is bundled into the APK, so include it.
          key="$({ git ls-files -s -z -- \
            apps/mobile package.json bun.lock .github/workflows/mobile-e2e.yml .github/actions/setup/action.yml \
            ':(exclude)apps/mobile/tests/**' \
            ':(exclude)apps/mobile/README.md'; \
            printf '%s' "$EXPO_PUBLIC_API_URL"; } | sha256sum | cut -d' ' -f1)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore APK with identical build inputs
        id: apk-cache
        if: inputs.force_rebuild != true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          key: android-e2e-apk-v1-${{ runner.os }}-${{ steps.fingerprint.outputs.key }}

      - name: Setup workspace
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup

      - name: Setup Java
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Android project
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install

      - name: Setup Gradle
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Build Android release APK for emulator
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: ./gradlew assembleRelease --no-daemon --build-cache -Pandroid.enableMinifyInReleaseBuilds=false -PreactNativeArchitectures=x86_64

      - name: Save APK for future test-only changes
        if: steps.apk-cache.outputs.cache-hit != 'true' && inputs.force_rebuild != true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          key: android-e2e-apk-v1-${{ runner.os }}-${{ steps.fingerprint.outputs.key }}

      - name: Record Android build or reuse
        env:
          CACHE_HIT: ${{ steps.apk-cache.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == "true" ]]; then
            echo "### Android APK: reused cache for identical build inputs" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Android APK: fresh build from source" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK from this commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fitwear-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Android Maestro E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Verify E2E helper tests
        run: >-
          bun test
          ./.github/scripts/generate-maestro-summary.test.ts
          ./.github/scripts/cleanup-maestro-account.test.ts
          ./.github/scripts/validate-e2e-environment.test.ts

      - name: Download APK from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: fitwear-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release

      - name: Enable KVM acceleration
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::Android KVM acceleration is not available."
            exit 1
          fi
          sudo chmod 666 /dev/kvm

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro 2.12.0
        env:
          MAESTRO_VERSION: "2.12.0"
        run: |
          curl --fail --location --silent --show-error --retry 3 https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Snapshot staging E2E account
        id: snapshot-account
        env:
          MAESTRO_CLEANUP_STATE: ${{ runner.temp }}/maestro-account-${{ github.run_id }}-${{ github.run_attempt }}.json
          MAESTRO_TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
          E2E_D1_DATABASE_ID: ${{ secrets.E2E_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun .github/scripts/cleanup-maestro-account.ts snapshot

      - name: Execute Maestro flows on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          MAESTRO_TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
          MAESTRO_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
          MAESTRO_INCLUDE_TAGS: ${{ inputs.include_tags }}
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -accel on -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/run-maestro-android.sh

      - name: Clean up staging account
        if: ${{ always() && steps.snapshot-account.outcome == 'success' }}
        env:
          MAESTRO_TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
          MAESTRO_CLEANUP_STATE: ${{ runner.temp }}/maestro-account-${{ github.run_id }}-${{ github.run_attempt }}.json
          E2E_D1_DATABASE_ID: ${{ secrets.E2E_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun .github/scripts/cleanup-maestro-account.ts cleanup

      - name: Upload recording videos
        id: upload-recording
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fitwear-e2e-recording-${{ github.run_attempt }}
          path: maestro-artifacts/**/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit, screenshots, and diagnostics
        id: upload-artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maestro-e2e-artifacts-${{ github.run_attempt }}
          path: maestro-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish Maestro results
        if: ${{ always() }}
        env:
          RECORDING_URL: ${{ steps.upload-recording.outputs.artifact-url }}
          ARTIFACTS_URL: ${{ steps.upload-artifacts.outputs.artifact-url }}
          MAESTRO_EXIT_CODE: ${{ env.MAESTRO_EXIT_CODE }}
        run: bun .github/scripts/generate-maestro-summary.ts

      - name: Require passing Maestro and valid JUnit
        if: ${{ always() }}
        env:
          MAESTRO_EXIT_CODE: ${{ env.MAESTRO_EXIT_CODE }}
        run: bun .github/scripts/verify-maestro-result.ts
