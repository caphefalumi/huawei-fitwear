name: Mobile E2E

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Android Maestro E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Enable KVM acceleration for Android E2E
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Setup Java for Android E2E
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro CLI
        run: |
          export MAESTRO_VERSION=2.12.0
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://fitwear.tm-project.id.vn/
        run: bunx expo prebuild --platform android --no-install

      - name: Cache Gradle build
        id: cache-gradle-build
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key: ${{ runner.os }}-gradle-build-${{ hashFiles('apps/mobile/android/**', 'apps/mobile/src/**', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-
            ${{ runner.os }}-gradle-

      - name: Build Android debug APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://fitwear.tm-project.id.vn/
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Run the single Maestro end-to-end flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -accel on -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test apps/mobile/tests/e2e/fitness.yaml

      - name: Upload Maestro debug output on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-debug-output
          path: ~/.maestro/tests/
          if-no-files-found: ignore
