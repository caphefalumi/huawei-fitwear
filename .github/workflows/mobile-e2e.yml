name: Mobile E2E

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      include_tags:
        description: Comma-separated Maestro tags (OR); leave blank to run every top-level flow
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Setup Java for Android build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://fitwear.tm-project.id.vn/
        run: bunx expo prebuild --platform android --no-install

      - name: Cache Android Gradle build
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
            apps/mobile/android/app/build
          key: ${{ runner.os }}-android-gradle-${{ hashFiles('apps/mobile/android/**', 'apps/mobile/app/**', 'apps/mobile/src/**', 'apps/mobile/app.json', 'apps/mobile/package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-gradle-

      - name: Build Android release APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://fitwear.tm-project.id.vn/
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: ./gradlew assembleRelease --no-daemon --build-cache -Pandroid.enableMinifyInReleaseBuilds=false -PreactNativeArchitectures=x86_64

      - name: Upload Android release APK
        uses: actions/upload-artifact@v6
        with:
          name: fitwear-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  e2e:
    name: Android Maestro E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Verify Maestro reporting
        run: bun test ./.github/scripts/generate-maestro-summary.test.ts

      - name: Download Android release APK
        uses: actions/download-artifact@v8
        with:
          name: fitwear-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release

      - name: Enable KVM acceleration for Android E2E
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm || true

      - name: Setup Java for Maestro
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro CLI
        run: |
          export MAESTRO_VERSION=2.12.0
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run selected Maestro E2E flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
          MAESTRO_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
          MAESTRO_INCLUDE_TAGS: ${{ inputs.include_tags }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -accel on -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            sleep 5
            mkdir -p maestro-artifacts
            test -n "$MAESTRO_TEST_EMAIL" && test -n "$MAESTRO_TEST_PASSWORD"
            maestro test --format junit --output maestro-artifacts/report.xml --test-output-dir maestro-artifacts -e MAESTRO_TEST_EMAIL="$MAESTRO_TEST_EMAIL" -e MAESTRO_TEST_PASSWORD="$MAESTRO_TEST_PASSWORD" ${MAESTRO_INCLUDE_TAGS:+--include-tags "$MAESTRO_INCLUDE_TAGS"} apps/mobile/tests/e2e; status=$?; printf 'MAESTRO_EXIT_CODE=%s\n' "$status" >> "$GITHUB_ENV"; exit "$status"

      - name: Upload Maestro recording video
        id: upload-recording
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fitwear-e2e-recording-${{ github.run_attempt }}
          path: maestro-artifacts/**/*.mp4
          if-no-files-found: ignore

      - name: Upload Maestro test artifacts and recordings
        id: upload-artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-e2e-artifacts-${{ github.run_attempt }}
          path: maestro-artifacts/
          if-no-files-found: ignore

      - name: Generate Maestro E2E summary
        if: always()
        env:
          RECORDING_URL: ${{ steps.upload-recording.outputs.artifact-url }}
          ARTIFACTS_URL: ${{ steps.upload-artifacts.outputs.artifact-url }}
          MAESTRO_EXIT_CODE: ${{ env.MAESTRO_EXIT_CODE }}
        run: bun .github/scripts/generate-maestro-summary.ts
