name: Probe Gradle Downloads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check distribution hosts
        run: |
          for url in \
            "https://services.gradle.org/distributions/gradle-9.4.1-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-9.4.1-bin.zip" \
            "https://github.com/gradle/gradle-distributions/releases/download/v9.4.1/gradle-9.4.1-bin.zip"
          do
            printf '%s -> ' "$url"
            curl -sS -o /dev/null -w 'status=%{http_code} redirect=%{redirect_url} time=%{time_total}\n' --max-time 30 -I "$url" || printf 'curl failed (%s)\n' "$?"
          done
