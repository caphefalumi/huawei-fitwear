name: Sync Resend Templates

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/email-templates/**"
      - "apps/backend/scripts/sync-resend-templates.ts"
      - "apps/backend/wrangler.json"
      - ".github/workflows/resend-templates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resend-templates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Update Resend Templates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate templates
        run: bun apps/backend/scripts/sync-resend-templates.ts --dry-run

      - name: Sync templates to Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: bun apps/backend/scripts/sync-resend-templates.ts
