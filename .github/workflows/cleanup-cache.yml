name: Cleanup Caches

on:
  schedule:
    - cron: "0 2 * * *"
      timezone: Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Invalidate and purge old caches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Invalidate stale caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Fetching and cleaning up caches older than 7 days..."
          gh cache list --limit 100 --json id,lastAccessedAt | jq -r '
            .[] | select((now - (.lastAccessedAt | fromdateiso8601)) > 604800) | .id
          ' | while read -r cache_id; do
            if [ -n "$cache_id" ]; then
              echo "Deleting stale cache ID: $cache_id"
              gh cache delete "$cache_id" || true
            fi
          done
