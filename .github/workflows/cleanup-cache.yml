name: Cleanup Caches

on:
  schedule:
    - cron: "0 2 * * *"
      timezone: Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Invalidate and purge old caches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Invalidate stale caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Deleting superseded caches (only the newest cache per key family is kept)..."
          gh cache list --limit 1000 --json id,key,createdAt | jq -r '
            def ts: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
            map(. + {t: (.createdAt | ts), family: (.key | sub("-[0-9a-f]{8,}(-[0-9]+)*$"; ""))})
            | group_by(.family)[]
            | sort_by(.t) | .[:-1][] | .id
          ' | while read -r cache_id; do
            if [ -n "$cache_id" ]; then
              echo "Deleting stale cache ID: $cache_id"
              gh cache delete "$cache_id" || true
            fi
          done
