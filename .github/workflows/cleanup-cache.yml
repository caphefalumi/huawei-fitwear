name: Cleanup Caches

on:
  pull_request:
    branches: [main]
    types: [closed]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    name: Invalidate and purge old caches
    runs-on: ubuntu-latest
    steps:
      - name: Invalidate merged PR caches
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Invalidating caches for closed PR #${PR_NUMBER}..."
          gh cache delete --ref "refs/pull/${PR_NUMBER}/merge" --all --succeed-on-no-caches || true

      - name: Invalidate stale caches
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Fetching and cleaning up caches older than 7 days..."
          gh cache list --limit 100 --json id,lastAccessedAt | jq -r '
            .[] | select((now - (.lastAccessedAt | fromdateiso8601)) > 604800) | .id
          ' | while read -r cache_id; do
            if [ -n "$cache_id" ]; then
              echo "Deleting stale cache ID: $cache_id"
              gh cache delete "$cache_id" || true
            fi
          done
