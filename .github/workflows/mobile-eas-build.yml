name: Mobile EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: EAS build profile
        type: choice
        options: [development, preview, production]
        default: preview

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  build:
    name: EAS build
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
      - name: Build on EAS
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PLATFORM: ${{ inputs.platform }}
          EAS_PROFILE: ${{ inputs.profile }}
          EXPO_NO_TELEMETRY: "1"
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::EXPO_TOKEN is required to run EAS builds."
            exit 1
          fi
          bunx eas-cli@22.0.0 build --platform "$EAS_PLATFORM" --profile "$EAS_PROFILE" --non-interactive
